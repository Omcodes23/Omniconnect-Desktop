services:
  postgres:
    image: postgres:17-alpine
    container_name: omniconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: omniconnect
      POSTGRES_USER: root
      POSTGRES_PASSWORD: toor
    ports:
      # Bound to 0.0.0.0 so other devices on the LAN can reach the database too.
      - "5432:5432"
    volumes:
      - omniconnect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d omniconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  omniconnect_pgdata:
