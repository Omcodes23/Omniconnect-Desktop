version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: omniconnect-db
    environment:
      POSTGRES_DB: omniconnect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: src/Backend/Dockerfile
    container_name: omniconnect-api
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=omniconnect;Username=postgres;Password=postgres"
      Jwt__Secret: "ThisIsADevelopmentSecretKeyThatMustBeChangedInProduction!@#$%"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
